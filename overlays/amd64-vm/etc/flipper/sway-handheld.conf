# Handheld mode: flipctl alone on the screen. flipper-handheld-session.sh sets each
# output's scale to the largest whole number at which 256x144 still fits, and
# nearest-neighbour filtering keeps every panel pixel a sharp square.
#
# No bindings: in a kiosk every key belongs to flipctl. VT switching
# (Ctrl+Alt+F1..F12) is sway's own and still works.
xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 1
output * bg #000000 solid_color
output * scale_filter nearest
for_window [app_id="net.flipper.flipctl"] fullscreen enable

exec /usr/local/bin/flipper-handheld-session.sh
