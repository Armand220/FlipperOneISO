# Run Flipper's prebuilt aarch64 apps on this amd64 machine through qemu-user.
#
# qemu-user-binfmt already registers aarch64 ELF files, but its magic requires ELF
# header bytes 8-15 to be zero, and a type-2 AppImage writes "AI\x02" there. This is
# the same match with those three bytes set, sent to the same interpreter, so an
# aarch64 AppImage starts like any other program. What it runs inside is ordinary
# aarch64 ELF, which the stock rule takes; glibc for it is libc6:arm64.
:qemu-aarch64-appimage:M::\x7f\x45\x4c\x46\x02\x01\x01\x00\x41\x49\x02\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/libexec/qemu-binfmt/aarch64-binfmt-P:POF
